name: Multi-platform MATLAB Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build installer (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: linux
            os: ubuntu-latest

    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Check MATLAB Compiler license token
        shell: bash
        run: |
          if [ -z "${MLM_LICENSE_TOKEN:-}" ]; then
            echo "::error::Configure the MLM_LICENSE_TOKEN repository secret before creating a compiled release."
            exit 1
          fi

      - name: Set up MATLAB and MATLAB Compiler
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: MATLAB_Compiler
          cache: true

      - name: Build native installer
        uses: matlab-actions/run-command@v3
        with:
          command: buildFFTAnalysisSoftware

      - name: Package Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath "dist/FFTAnalysisAppInstaller-windows" -Recurse -File -Filter "FFTAnalysisAppInstaller.exe" | Select-Object -First 1
          if ($null -eq $installer) {
            throw "FFTAnalysisAppInstaller.exe was not found in the Windows installer output."
          }
          Copy-Item -LiteralPath $installer.FullName -Destination "dist/FFTAnalysisAppInstaller-windows-x64.exe" -Force

      - name: Upload Windows installer
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/FFTAnalysisAppInstaller-windows-x64.exe
          if-no-files-found: error

      - name: Package macOS disk image
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          app=$(find "dist/FFTAnalysisAppInstaller-macos" -type d -name "*.app" -print -quit)
          if [ -z "$app" ]; then
            echo "No macOS installer app bundle was found."
            exit 1
          fi
          hdiutil create \
            -volname "FFT Analysis Tools" \
            -srcfolder "$app" \
            -ov \
            -format UDZO \
            "dist/FFTAnalysisAppInstaller-macos.dmg"

      - name: Upload macOS installer
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: dist/FFTAnalysisAppInstaller-macos.dmg
          if-no-files-found: error

      - name: Package Linux installer
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          installer=$(find "dist/FFTAnalysisAppInstaller-linux" -type f -name "*.install" -print -quit)
          if [ -z "$installer" ]; then
            echo "No Linux installer file was found."
            exit 1
          fi
          cp "$installer" "dist/FFTAnalysisAppInstaller-linux.install"
          chmod +x "dist/FFTAnalysisAppInstaller-linux.install"

      - name: Upload Linux installer
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: dist/FFTAnalysisAppInstaller-linux.install
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download platform installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: installer-*
          merge-multiple: true

      - name: Remove legacy archive assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in FFTAnalysisAppInstaller.exe FFTAnalysisAppInstaller-macos.zip FFTAnalysisAppInstaller-linux.zip; do
            gh release delete-asset "${GITHUB_REF_NAME}" "$asset" \
              --repo "${GITHUB_REPOSITORY}" \
              --yes || true
          done

      - name: Publish bilingual release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-assets/FFTAnalysisAppInstaller-windows-x64.exe
            release-assets/FFTAnalysisAppInstaller-macos.dmg
            release-assets/FFTAnalysisAppInstaller-linux.install
          generate_release_notes: true
          body: |
            ## FFT Analysis Tools ${{ github.ref_name }}

            Native MATLAB Compiler packages are provided for Windows, macOS, and Linux.
            The source workflow still requires MATLAB; compiled applications require the matching MATLAB Runtime R2024b.
            The Windows asset is `FFTAnalysisAppInstaller-windows-x64.exe`; the macOS asset is `FFTAnalysisAppInstaller-macos.dmg`; the Linux asset is `FFTAnalysisAppInstaller-linux.install`.

            Source code is available from the tag archives:
            - [Source code (ZIP)](${{ github.server_url }}/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.zip)
            - [Source code (TAR.GZ)](${{ github.server_url }}/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz)

            本版本提供 Windows、macOS 和 Linux 原生 MATLAB Compiler 安装包。
            源码方式需要安装 MATLAB；编译应用需要匹配的 MATLAB Runtime R2024b。
            Windows 资产为 `FFTAnalysisAppInstaller-windows-x64.exe`，macOS 资产为 `FFTAnalysisAppInstaller-macos.dmg`，Linux 资产为 `FFTAnalysisAppInstaller-linux.install`。

            源代码可通过标签归档下载：
            - [源代码（ZIP）](${{ github.server_url }}/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.zip)
            - [源代码（TAR.GZ）](${{ github.server_url }}/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz)
