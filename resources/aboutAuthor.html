<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #0f151b;
      color: #e9eef3;
    }
    .panel {
      box-sizing: border-box;
      height: 100%;
      padding: 28px 32px;
      background:
        linear-gradient(135deg, rgba(31, 111, 167, 0.16), rgba(15, 21, 27, 0) 48%),
        #0f151b;
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 30px;
      line-height: 1.12;
      letter-spacing: 0;
    }
    .subtitle {
      margin: 0 0 22px 0;
      color: #b8c8d6;
      font-size: 13px;
    }
    .author {
      margin: 0 0 18px 0;
      font-size: 16px;
      color: #f0b35a;
      font-weight: 700;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 480px;
    }
    .link {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 44px;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid rgba(180, 202, 219, 0.24);
      background: rgba(255, 255, 255, 0.06);
      color: #eaf3fb;
      text-decoration: none;
      cursor: pointer;
    }
    .link:hover {
      background: rgba(62, 142, 197, 0.24);
      border-color: rgba(118, 184, 229, 0.55);
    }
    svg {
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
    }
    .label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .url {
      display: block;
      color: #b8c8d6;
      font-size: 11px;
      overflow-wrap: anywhere;
    }
    .copyright {
      margin-top: 20px;
      color: #91a1ae;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>FFT Analysis Tools</h1>
    <p class="subtitle">MATLAB FFT / THD analysis for MAT and oscilloscope CSV data</p>
    <p class="author">Zhenbin Huang</p>

    <div class="links">
      <a class="link" href="#" data-url="https://orcid.org/0000-0002-0628-0387">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="12" fill="#A6CE39"></circle>
          <text x="6" y="16" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#ffffff">iD</text>
        </svg>
        <span>
          <span class="label">ORCID</span>
          <span class="url">https://orcid.org/0000-0002-0628-0387</span>
        </span>
      </a>
      <a class="link" href="#" data-url="https://www.linkedin.com/in/zhenbin-huang/">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect width="24" height="24" rx="4" fill="#0A66C2"></rect>
          <text x="6" y="17" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">in</text>
        </svg>
        <span>
          <span class="label">LinkedIn</span>
          <span class="url">https://www.linkedin.com/in/zhenbin-huang/</span>
        </span>
      </a>
    </div>

    <p class="copyright">Copyright (c) 2026 Zhenbin Huang</p>
  </div>
  <script>
    function setup(htmlComponent) {
      document.addEventListener("click", function(event) {
        var target = event.target.closest("[data-url]");
        if (!target) {
          return;
        }
        event.preventDefault();
        htmlComponent.sendEventToMATLAB("OpenLink", target.getAttribute("data-url"));
      });
    }
  </script>
</body>
</html>
